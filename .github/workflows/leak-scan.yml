name: leak-scan

# Server-side leak gate: scans tracked-file content and incoming commit messages
# for internal markers (read from the SCRUB_MARKERS org secret) and fails on any
# hit. Reports paths / SHAs only — never the matched content (a public Actions
# log is world-readable). On a fork PR the secret is absent, so the scan skips.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  leak-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run leak gate
        env:
          SCRUB_MARKERS: ${{ secrets.SCRUB_MARKERS }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          printf '%s\n' "$SCRUB_MARKERS" | grep -vE '^[[:space:]]*$' > /tmp/markers.txt || true
          if [ ! -s /tmp/markers.txt ]; then
            echo "SCRUB_MARKERS not configured (e.g. fork PR) — skipping leak scan."
            exit 0
          fi
          fail=0

          echo "== tracked file content =="
          if files=$(git grep -lIiE -f /tmp/markers.txt -- . 2>/dev/null); then
            echo "::error::internal markers found in tracked files (paths below; content withheld)"
            echo "$files"
            fail=1
          fi

          echo "== incoming commit messages =="
          if [ "$EVENT" = "pull_request" ]; then
            range=( "$PR_BASE..$PR_HEAD" )
          elif printf '%s' "$PUSH_BEFORE" | grep -qE '^0*$'; then
            range=( -1 "$PUSH_AFTER" )
          else
            range=( "$PUSH_BEFORE..$PUSH_AFTER" )
          fi
          bad=""
          for sha in $(git log --format='%H' "${range[@]}" 2>/dev/null); do
            if git log -1 --format='%s%n%b' "$sha" | grep -qiE -f /tmp/markers.txt; then
              bad="$bad $sha"
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error::internal markers found in commit messages (SHAs below; text withheld)"
            printf '%s\n' $bad
            fail=1
          fi

          if [ "$fail" -eq 0 ]; then
            echo "leak-scan: clean — no internal markers"
          else
            echo "leak-scan: internal markers detected (see annotations above)."
          fi
          exit "$fail"
